
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Characters | The Crimson and The Ashen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #0b0b0f;
            --panel: #111116;
            --crimson: crimson;
            --accent: #d34b65;
            --border: #302027;
            --muted: #aaa;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--background);
            color: white;
            font-family: Georgia, serif;
        }


/* TOP NAVIGATION */
nav {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    padding: 22px 15px;
    background: #08080b;
    border-bottom: 1px solid var(--border);
}

nav a {
    color: #d9cdd0;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
    transition: color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
}

nav a:hover,
nav a:focus-visible,
nav a.active,
nav a.selected {
    color: var(--crimson);
}

/* MOBILE NAVIGATION */
@media (max-width: 480px) {
    nav {
        gap: 18px;
    }

    nav a {
        font-size: 10px;
        letter-spacing: 1px;
    }
}


        /* CHARACTER SECTION */
        #characters {
            display: block;
            padding: 45px 25px;
            animation: fadeSlideIn 0.6s ease both;
        }

        .section-heading {
            text-align: center;
            letter-spacing: 4px;
            margin: 0 0 35px;
        }

        /* SLIDESHOW LAYOUT */
        .character-view {
            display: grid;
            grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
            gap: clamp(25px, 4vw, 55px);
            align-items: start;
            max-width: 1250px;
            margin: 0 auto;
        }

        /* ARTWORK PANEL */
        .art-panel {
            position: sticky;
            top: 24px;
            align-self: start;
            isolation: isolate;
            height: min(76vh, 760px);
            min-height: 520px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111116;
            border: 1px solid #302027;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .art-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.025);
        }

        .character-art {
            position: absolute;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            animation: artworkFadeIn 0.45s ease both;
        }

        .art-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(11, 11, 15, 0.02) 35%,
                rgba(11, 11, 15, 0.12) 48%,
                rgba(11, 11, 15, 0.68) 70%,
                rgba(11, 11, 15, 0.97) 100%
            );
        }

        .art-placeholder {
            position: absolute;
            inset: 0;
            z-index: -2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 25px;
            color: #777;
            text-align: center;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        /* CHARACTER IDENTITY OVERLAY */
        .art-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
            padding: 35px clamp(20px, 3vw, 38px) 30px;
            pointer-events: none;
        }

        .art-overlay .overlay-number {
            color: #e07b8e;
            font-size: 11px;
            letter-spacing: 4px;
            margin: 0 0 12px;
        }

        .art-overlay .overlay-name {
            margin: 0 0 12px;
            color: #fff;
            font-size: clamp(30px, 3.2vw, 48px);
            line-height: 1.12;
            font-weight: normal;
            overflow-wrap: anywhere;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
        }

        .art-overlay .overlay-title {
            margin: 0;
            color: #ed7189;
            font-size: clamp(10px, 1.1vw, 13px);
            line-height: 1.8;
            letter-spacing: 2px;
            overflow-wrap: anywhere;
        }

        .art-overlay .overlay-rank {
            display: inline-block;
            margin: 17px 0 0;
            padding: 7px 12px;
            border: 1px solid rgba(211, 75, 101, 0.55);
            background: rgba(11, 11, 15, 0.55);
            color: #eee;
            font-size: 12px;
            letter-spacing: 1.5px;
        }

        /* RIGHT-SIDE CHARACTER INFORMATION */
        .character-details {
            padding: 10px 0 20px;
            min-width: 0;
        }

        .character-details > .character-number,
        .character-details > .character-name,
        .character-details > .character-title,
        .character-details > .character-rank,
        .character-details > .character-divider {
            display: none;
        }

        /* PROFILE TABS */
        .profile-tabs {
            position: relative;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 0;
            border-bottom: 1px solid #49232e;
        }

        .profile-tab {
            padding: 14px 13px;
            border: none;
            border-bottom: 2px solid transparent;
            background: transparent;
            color: #999;
            font-family: Georgia, serif;
            font-size: 11px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.3s, border-color 0.3s;
        }

        .profile-tab:hover {
            color: white;
        }

        .profile-tab.active {
            color: #e8758c;
            border-bottom-color: crimson;
        }

        .profile-tab:focus-visible {
            outline: 1px solid #d34b65;
            outline-offset: 3px;
        }

        /* PROFILE CONTENT */
        .character-info {
            color: #bcbcc2;
            line-height: 1.9;
            font-size: 15px;
            overflow-wrap: anywhere;
            max-height: 68vh;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 10px 16px 20px 0;
            scrollbar-width: thin;
            scrollbar-color: #673044 #111116;
        }

        .character-info::-webkit-scrollbar {
            width: 6px;
        }

        .character-info::-webkit-scrollbar-track {
            background: #111116;
        }

        .character-info::-webkit-scrollbar-thumb {
            background: #673044;
            border-radius: 10px;
        }

        .character-info::-webkit-scrollbar-thumb:hover {
            background: #a13a55;
        }

        .character-info h3 {
            color: #d34b65;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .character-info p {
            margin: 12px 0;
        }

        .character-info strong {
            color: white;
        }

        .character-info ul {
            padding-left: 20px;
        }

        .character-info li {
            margin-bottom: 14px;
        }

        .ability-name {
            color: #e06a80;
            font-weight: bold;
        }

        /* QUICK INFO */
        .quick-info-list {
            list-style: none;
            padding: 0 !important;
        }

        .quick-info-list li {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #302027;
        }

        .quick-info-label {
            color: #d34b65;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .quick-info-value {
            color: #eee;
            text-align: right;
        }

        /* SLIDESHOW CONTROLS */
        .slide-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            margin: 35px auto 10px;
        }

        .arrow-button {
            width: 48px;
            height: 48px;
            border: 1px solid #673044;
            background: #141016;
            color: white;
            font-family: Georgia, serif;
            font-size: 28px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s,
                        border-color 0.3s;
        }

        .arrow-button:hover {
            background: crimson;
            border-color: crimson;
        }

        .arrow-button:focus-visible {
            outline: 1px solid #d34b65;
            outline-offset: 4px;
        }

        #slide-counter {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* ANIMATIONS */
        @keyframes artworkFadeIn {
            from { opacity: 0.35; }
            to { opacity: 1; }
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-out {
            animation: slideOut 0.2s ease forwards;
        }

        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(-20px);
            }
        }

        /* FOOTER */
        footer {
            margin-top: 80px;
            padding: 20px;
            color: #777;
            text-align: center;
            font-size: 13px;
            border-top: 1px solid var(--border);
        }

        /* TABLET AND MOBILE LAYOUT */
        @media (max-width: 700px) {
            nav {
                gap: 20px;
                padding: 20px 12px;
            }

            nav a {
                font-size: 11px;
                letter-spacing: 1.5px;
            }

            #characters {
                padding: 30px 18px;
            }

            .character-view {
                grid-template-columns: minmax(0, 1fr);
                gap: 25px;
            }

            .art-panel {
                position: relative;
                top: auto;
                height: min(68vh, 620px);
                min-height: 390px;
                max-height: 620px;
            }

            .character-art {
                object-position: center center;
            }

            .art-overlay {
                padding: 30px 22px 23px;
            }

            .art-overlay .overlay-name {
                font-size: clamp(30px, 8vw, 43px);
            }

            .art-overlay .overlay-title {
                font-size: 11px;
            }

            .character-details {
                text-align: center;
                padding-top: 0;
            }

            .profile-tabs {
                justify-content: center;
            }

            .profile-tab {
                padding: 12px 9px;
                font-size: 10px;
            }

            .character-info {
                max-height: none;
                overflow: visible;
                padding: 10px 2px 20px;
                text-align: left;
                scrollbar-width: auto;
            }

            .quick-info-value {
                text-align: left;
            }

            .quick-info-list li {
                justify-content: flex-start;
            }

            .slide-controls {
                margin-top: 25px;
            }

            footer {
                margin-top: 50px;
            }
        }

        @media (max-width: 380px) {
            .profile-tabs {
                gap: 0;
            }

            .profile-tab {
                padding: 12px 6px;
                font-size: 9px;
                letter-spacing: 0.5px;
            }

            .art-panel {
                min-height: 350px;
            }

            .art-overlay .overlay-title {
                letter-spacing: 1.2px;
            }
        }

        /* RESPECT REDUCED-MOTION PREFERENCES */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

                    <h3>CHARACTER INFO</h3>
                    <p>Jin Tomoe is the VI Prime Sovereign of the Yomi Sovereignty, a warrior whose life revolves around survival, the pursuit of his missing sister, and the struggle to keep a dangerous presence within himself under control. Known as The Crimson Shroud, Jin is the counterpart to Rin Tomoe, the Bleeding Heart Sovereign. Together, they form the central pair of The Crimson and the Ashen. Unlike Rin, who primarily relies on physical strikes and possesses a powerful transformation that drains her Life Force, Jin's base form is comparatively weak. He compensates with dual daggers, adaptable combat techniques, and a fighting style that requires careful management of his Courage Points. However, defeat does not necessarily mean the end of Jin's fight. When he falls, a hidden evil within him can take over his body, transforming him into the Crimson Shroud's more dangerous form.</p>

                            — Jin's fighting style depends on Courage Points. As his Courage Points decrease, the likelihood of his Struggling Form emerging gradually increases.
                        </li>
                        <li>
                            <span class="ability-name">The Abyss Sense</span>
                            — Jin uses his black-tipped hair to sense the attribute levels of enemies. This ability also grants him movement-speed and attack-speed boosts while consuming Courage Points.
                        </li>

                            <span class="ability-name">Crimson Trample</span>

                        </li>

                    <h3>COMBAT OPTIONS</h3>

                        </li>
                        <li>
                            <span class="ability-name">My Bleeding Heart Never Fades</span>
                            — Rin enters a pink, broken-blade-like cocoon and awakens after 40 seconds.
                        </li>
                        <li>
                            <span class="ability-name">Courage Warmth's my Heart</span>
                            — creates a heart-shaped shield for 8 seconds.
                        </li>
                        <li>
                            <span class="ability-name">Heart Bleeds Within</span>
                            — Rin's second form, which drains Life Force faster.
                        </li>
                        <li>
                            <span class="ability-name">For you, and For my Crying Heart</span>
                            — a combination technique with Jin that lasts 50 seconds.
                        </li>
                        <li>
                            <span class="ability-name">Don't Let It Take My Shattering Heart (Associated with Heart Bleeds Within Form)</span>
                            — When Rin's Life Force becomes critically depleted, she may lose consciousness for more than twenty seconds. During this state, a sinister, shadow-like presence emerges and immediately reaches for nearby living beings, attempting to consume their Souls to restore her Life Force.
                        </li>
                        <li>
                            <span class="ability-name">The Kiss of Death (Associated with Heart Bleeds Within Form)</span>
                            — Rin charges toward a target and kisses the enemy on the cheek, causing the target to turn to ashes.
                        </li>
                        <li>
                            <span class="ability-name">The Burning Feeling (Associated with Heart Bleeds Within Form)</span>
                            — Rin actively splashes her bleeding blood onto enemies, inflicting Burning.
                        </li>
                        <li>
                            <span class="ability-name">The Heart's Punishment (Associated with Heart Bleeds Within Form)</span>
                            — Rin opens and shatters the earth, releasing deadly dark hearts that attach themselves to enemies and slowly burn them from within.
                        </li>
                    </ul>
                    <p><em>I found you....Big brother..</em></p>
                `
            }
        };

        let currentCharacter = 0;
        let isAnimating = false;

        const characterContent =
            document.getElementById("character-content");

        const artPanel = document.getElementById("art-panel");

        const overlayNumber = document.getElementById("overlay-number");
        const overlayName = document.getElementById("overlay-name");
        const overlayTitle = document.getElementById("overlay-title");
        const overlayRank = document.getElementById("overlay-rank");

        const characterNumber = document.getElementById("character-number");
        const characterName = document.getElementById("character-name");
        const characterTitle = document.getElementById("character-title");
        const characterRank = document.getElementById("character-rank");

        const characterInfo = document.getElementById("character-info");
        const slideCounter = document.getElementById("slide-counter");

        const infoTab = document.getElementById("info-tab");
        const quickInfoTab = document.getElementById("quick-info-tab");
        const combatTab = document.getElementById("combat-tab");

        // SWITCH BETWEEN PROFILE TABS
        function showProfileTab(tabName) {
            const character = characterList[currentCharacter];
            const profile = profileData[character.name];

            const tabContent = {
                info: profile.info,
                quickInfo: profile.quickInfo,
                combat: profile.combat
            };

            const tabElements = {
                info: infoTab,
                quickInfo: quickInfoTab,
                combat: combatTab
            };

            if (!tabContent[tabName]) {
                return;
            }

            characterInfo.innerHTML = tabContent[tabName];

            Object.keys(tabElements).forEach(function(key) {
                const isActive = key === tabName;

                tabElements[key].classList.toggle("active", isActive);
                tabElements[key].setAttribute(
                    "aria-selected",
                    String(isActive)
                );
            });

            characterInfo.setAttribute(
                "aria-labelledby",
                tabElements[tabName].id
            );

            characterInfo.scrollTop = 0;
        }

        infoTab.addEventListener("click", function() {
            showProfileTab("info");
        });

        quickInfoTab.addEventListener("click", function() {
            showProfileTab("quickInfo");
        });

        combatTab.addEventListener("click", function() {
            showProfileTab("combat");
        });

        // DISPLAY SELECTED CHARACTER
        function showCharacter(index) {
            const character = characterList[index];

            const formattedNumber =
                "CHARACTER " + String(index + 1).padStart(2, "0");

            characterNumber.textContent = formattedNumber;
            characterName.textContent = character.name;
            characterTitle.textContent = character.title;
            characterRank.textContent = character.rank;

            overlayNumber.textContent = formattedNumber;
            overlayName.textContent = character.name;
            overlayTitle.textContent = character.title;
            overlayRank.textContent = character.rank;

            showProfileTab("info");

            // Remove old artwork and placeholders without removing the overlay.
            artPanel.querySelectorAll(
                ".character-art, .art-placeholder"
            ).forEach(function(element) {
                element.remove();
            });

            const image = document.createElement("img");

            image.className = "character-art";
            image.src = character.image;
            image.alt = character.imageAlt;

            image.onerror = function() {
                if (image.parentElement !== artPanel) {
                    return;
                }

                image.remove();

                const placeholder = document.createElement("p");
                placeholder.className = "art-placeholder";
                placeholder.textContent =
                    "Could not load " + character.image +
                    ". Check the filename and folder.";

                artPanel.insertBefore(
                    placeholder,
                    artPanel.querySelector(".art-overlay")
                );
            };

            artPanel.insertBefore(
                image,
                artPanel.querySelector(".art-overlay")
            );

            slideCounter.textContent =
                String(index + 1).padStart(2, "0") + " / " +
                String(characterList.length).padStart(2, "0");
        }

        // PREVIOUS / NEXT CHARACTER
        function changeCharacter(direction) {
            if (isAnimating) return;

            isAnimating = true;
            characterContent.classList.add("slide-out");

            setTimeout(function() {
                currentCharacter =
                    (currentCharacter + direction + characterList.length)
                    % characterList.length;

                showCharacter(currentCharacter);

                characterContent.classList.remove("slide-out");
                characterContent.style.animation = "none";

                void characterContent.offsetWidth;

                characterContent.style.animation =
                    "fadeSlideIn 0.5s ease both";

                isAnimating = false;
            }, 200);
        }

        document.getElementById("previous-button").addEventListener(
            "click",
            function() {
                changeCharacter(-1);
            }
        );

        document.getElementById("next-button").addEventListener(
            "click",
            function() {
                changeCharacter(1);
            }
        );

        // SHOW JIN'S PROFILE FIRST
        showCharacter(currentCharacter);
    </script>

</body>
</html>
